spring.application.name=turnos

# --- CONFIGURACIÓN DE BASE DE DATOS MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/turnos_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# --- CONFIGURACIÓN JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- INICIALIZACIÓN DE DATOS (Desactivado para evitar el error 409) ---
spring.sql.init.mode=never

# --- CONFIGURACIÓN JWT (JSON Web Token) ---
jwt.secret=MendozaSaludTurnosSistemaSecretKeyJWT256BitsLargaSegura2026!
jwt.expiration=86400000

spring.main.allow-bean-definition-overriding=true