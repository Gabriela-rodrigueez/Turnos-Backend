spring.application.name=turnos-test

# Base de datos en memoria para pruebas unitarias e integración aisladas
spring.datasource.url=jdbc:h2:mem:turnosdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En pruebas aisladas deshabilitamos Flyway y permitimos create-drop
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datos semilla de prueba para la suite de testing
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JWT
jwt.secret=MendozaSaludTurnosSistemaSecretKeyJWT256BitsLargaSegura2026!
jwt.expiration=86400000
