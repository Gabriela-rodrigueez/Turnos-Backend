spring.application.name=turnos

# --- CONFIGURACIÓN DE BASE DE DATABASE MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/turnos_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA / Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# --- INICIALIZACIÓN DE DATOS (Activado para que lea data.sql) ---
spring.sql.init.mode=never

# --- CONFIGURACIÓN JWT (JSON Web Token) ---
jwt.secret=MendozaSaludTurnosSistemaSecretKeyJWT256BitsLargaSegura2026!
jwt.expiration=86400000

spring.main.allow-bean-definition-overriding=true